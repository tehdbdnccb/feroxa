services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fixora
      POSTGRES_USER: fixora
      POSTGRES_PASSWORD: fixora_dev_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixora -d fixora"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
